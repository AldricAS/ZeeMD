name: Ekstrak zip

on:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  ekstrak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak zip ke root repo
        run: |
          for z in ./*.zip; do
            [ -e "$z" ] || continue
            rm -rf /tmp/x && mkdir /tmp/x
            unzip -q -o "$z" -d /tmp/x
            src=/tmp/x
            entries=$(ls -A /tmp/x)
            if [ "$(echo "$entries" | wc -l)" = "1" ] && [ -d "/tmp/x/$entries" ]; then
              src="/tmp/x/$entries"
            fi
            cp -a "$src"/. .
            rm -f "$z"
          done

      - name: Commit hasil
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "ekstrak zip" || exit 0
          git push
